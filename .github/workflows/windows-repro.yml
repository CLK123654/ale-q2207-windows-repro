name: q2207-reference-build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-reference:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB R2024b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Expand input package
        shell: pwsh
        run: |
          $inputRoot = Join-Path $env:RUNNER_TEMP q2207-input
          Expand-Archive -LiteralPath task\输入数据包.zip -DestinationPath $inputRoot

      - name: Generate Reference with MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('implementation'); analyze_fan_orders(fullfile(getenv('RUNNER_TEMP'),'q2207-input'),fullfile(pwd,'generated-reference'))

      - name: Upload generated Reference
        uses: actions/upload-artifact@v4
        with:
          name: q2207-generated-reference
          path: generated-reference
          if-no-files-found: error
